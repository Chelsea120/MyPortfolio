  <div class="contact-section">
    
    <div class="contact-left">
      <div class="contact-wrapper">
      <h2> Get In Touch</h2>
      <p> Feel free to get in touch. We'd love to hear from you. </p>
      </div>
    </div>

    <div class="contact-right">
      <form id="contactForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <input type="tel" id="phone" placeholder="Your Phone Number">

        <select id="topic" required>
          <option value="">Choose a topic</option>
          <option value="graphic">Graphic Design</option>
          <option value="Photo">Photography</option>
          <option value="web">Web Design</option>
        </select>
        
        <textarea id="messageInput" placeholder="Your Message" rows="5" required></textarea>

        <label>
          <input type="radio" name="contactMethod" value="email" required>
          Email
        </label>

        <label>
          <input type="radio" name="contactMethod" value="Phone" required>
          Phone
        </label>

        <button type="submit">Submit</button>


      </form>
      <p id="message"></p>
    </div>
  </div>
    
  </main>
